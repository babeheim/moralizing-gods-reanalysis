        "spaMM (>= 3.2.0)",
        "GLMMadaptive",
        "glmmTMB (>= 1.1.2.3)",
        "phylolm (>= 2.6.5)",
        "brms"
      ],
      "Enhances": [
        "rstan",
        "phyr",
        "rjags",
        "BayesianTools"
      ],
      "License": "GPL (>= 3)",
      "URL": "http://florianhartig.github.io/DHARMa/",
      "LazyData": "TRUE",
      "BugReports": "https://github.com/florianhartig/DHARMa/issues",
